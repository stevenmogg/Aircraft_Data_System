ctrl_interface=DIR=/run/wpa_supplicant GROUP=netdev
update_config=1
country=AU

network={
    ssid="CHANGE_ME_HOTSPOT_SSID"
    psk="CHANGE_ME_HOTSPOT_PASSWORD"
    key_mgmt=WPA-PSK
    priority=20
}

