ctrl_interface=DIR=/var/run/wpa_supplicant
update_config=1
country=AU
ap_scan=1

# Primary phone hotspot uplink (onboard wlan0 in AP+Client mode)
network={
	ssid="IdeasMan_iPhone"
	psk="CHANGE_ME"
	key_mgmt=WPA-PSK
	priority=20
}

