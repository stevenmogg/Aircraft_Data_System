ctrl_interface=DIR=/var/run/wpa_supplicant
update_config=1
country=AU
ap_scan=1

# Onboard wlan0 client (AP+Client). Higher priority = preferred.
# Put live PSKs on the Pi only — never commit real passwords.

network={
	ssid="Wentworth2020-2G"
	psk="CHANGE_ME"
	key_mgmt=WPA-PSK
	priority=30
}

network={
	ssid="IdeasMan_iPhone"
	psk="CHANGE_ME"
	key_mgmt=WPA-PSK
	priority=20
}

network={
	ssid="IdeasMan_iPad"
	psk="CHANGE_ME"
	key_mgmt=WPA-PSK
	priority=10
}
