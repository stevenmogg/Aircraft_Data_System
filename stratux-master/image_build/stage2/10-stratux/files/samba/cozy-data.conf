# Cozy Aircraft Data System — SMB share for iPad/iPhone (AvPlan flight plans, etc.)
# Included from /etc/samba/smb.conf on Stratux images.

[cozy-data]
   comment = Cozy data (flight plans and project files)
   path = /cozy-data-system/data
   browseable = yes
   read only = no
   writable = yes
   guest ok = no
   valid users = pi
   create mask = 0664
   directory mask = 0775
   force user = pi
   force group = pi
   vfs objects = fruit streams_xattr
   fruit:metadata = stream
   fruit:model = RackMac
   fruit:posix_rename = yes
   fruit:veto_appledouble = no
   fruit:nfs_aces = no
