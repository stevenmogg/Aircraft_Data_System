# Cozy Aircraft Historian — sampling configuration
#
# Every FIX-Gateway database key is listed under signals with the units
# stored in FIX (empty string if FIX has none), plus description and limits
# copied from the FIX item. Convert on ingest into FIX; Historian records
# those values unchanged.
#
# column: SQLite column on historian_10hz (rate_hz 10) or historian_1hz (rate_hz 1).
# Regenerated from config/fixgw/database/ via historian.database.fix_catalog.

historian:
  database_path: /cozy-data-system/data/historian/cozy_historian.sqlite
  aircraft_id: COZ
  fast_rate_hz: 10
  slow_rate_hz: 1
  commit_every_frames: 10
  sample_tolerance_s: 0.05
  control_socket: /cozy-data-system/data/historian/historian.sock

  fix:
    host: 127.0.0.1
    port: 3490

  signals:
    STRX_LAT:
      column: fix_lat
      units: deg
      type: float
      rate_hz: 10
      source: stratux
      description: Stratux GPS latitude
      min: -90.0
      max: 90.0
      initial: 0.0
      tol: 20000
    STRX_LONG:
      column: fix_long
      units: deg
      type: float
      rate_hz: 10
      source: stratux
      description: Stratux GPS longitude
      min: -180.0
      max: 180.0
      initial: 0.0
      tol: 20000
    STRX_GS:
      column: fix_gs
      units: knots
      type: float
      rate_hz: 10
      source: stratux
      description: Stratux GPS ground speed
      min: 0.0
      max: 2000.0
      initial: 0.0
      tol: 2000
    STRX_ALT:
      column: fix_alt
      units: ft
      type: float
      rate_hz: 10
      source: stratux
      description: Stratux GPS altitude MSL (GPSAltitudeMSL, already feet)
      min: -2000.0
      max: 60000.0
      initial: 0.0
      tol: 2000
    STRX_PALT:
      column: fix_palt
      units: ft
      type: float
      rate_hz: 10
      source: stratux
      description: Stratux pressure altitude (BaroPressureAltitude)
      min: -1000.0
      max: 60000.0
      initial: 0.0
      tol: 2000
    STRX_VS:
      column: fix_vs
      units: ft/min
      type: float
      rate_hz: 10
      source: stratux
      description: Stratux vertical speed
      min: -30000.0
      max: 30000.0
      initial: 0.0
      tol: 2000
    STRX_HEAD:
      column: fix_head
      units: deg
      type: float
      rate_hz: 10
      source: stratux
      description: Stratux magnetic / gyro heading
      min: 0.0
      max: 359.9
      initial: 0.0
      tol: 2000
    STRX_TRACK:
      column: fix_track
      units: deg
      type: float
      rate_hz: 10
      source: stratux
      description: Stratux GPS true course
      min: 0.0
      max: 359.9
      initial: 0.0
      tol: 2000
    STRX_ROLL:
      column: fix_roll
      units: deg
      type: float
      rate_hz: 10
      source: stratux
      description: Stratux roll angle
      min: -180.0
      max: 180.0
      initial: 0.0
      tol: 300
    STRX_PITCH:
      column: fix_pitch
      units: deg
      type: float
      rate_hz: 10
      source: stratux
      description: Stratux pitch angle
      min: -90.0
      max: 90.0
      initial: 0.0
