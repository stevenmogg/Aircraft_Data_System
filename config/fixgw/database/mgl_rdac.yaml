items:
# MGL RDAC XF (CAN address 32) — source-specific keys (prefix MGL_RDAC_).
# Do not write canonical TACH1/EGT/OILT until aircraft channel mapping
# and analog calibration are known. TC values are compensated °F
# (thermocouple °C + RDAC_TEMP °C, then converted). Analog channels are 12-bit ADC.

- key: MGL_RDAC_FF1PC
  description: RDAC fuel-flow 1 pulse count (ID 1)
  type: int
  min: 0
  max: 65535
  initial: 0
  tol: 8000

- key: MGL_RDAC_FF1PR
  description: RDAC fuel-flow 1 pulse ratio (ID 1)
  type: float
  min: 0.0
  max: 1000.0
  initial: 0.0
  tol: 8000

- key: MGL_RDAC_FF2PC
  description: RDAC fuel-flow 2 pulse count (ID 1)
  type: int
  min: 0
  max: 65535
  initial: 0
  tol: 8000

- key: MGL_RDAC_FF2PR
  description: RDAC fuel-flow 2 pulse ratio (ID 1)
  type: float
  min: 0.0
  max: 1000.0
  initial: 0.0
  tol: 8000

- key: MGL_RDAC_TC1
  description: RDAC thermocouple 1 compensated (ID 2)
  type: float
  min: -400.0
  max: 3000.0
  units: degF
  initial: 0.0
  tol: 2000

